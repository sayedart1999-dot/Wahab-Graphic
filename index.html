<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wahab Graphic | Portfolio</title>
    <link rel="icon" type="image/png" href="https://i.imgur.com/mNctGoH.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Prevent libraries from trying to overwrite window.fetch
      if (window.fetch) {
        const originalFetch = window.fetch;
        try {
          Object.defineProperty(window, 'fetch', {
            configurable: false,
            enumerable: true,
            get: () => originalFetch,
            set: () => {
              console.warn('Attempted to overwrite window.fetch. This was blocked to prevent errors.');
            }
          });
        } catch (e) {
          console.error('Failed to lock window.fetch:', e);
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
